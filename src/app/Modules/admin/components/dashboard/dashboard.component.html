<div class="main">
  <div class="scroll-wrapper">
    <div *ngFor="let test of tests">
      <nz-card class="test-card" [nzBordered]="false">
        <div class="card-content">
          <div class="card-header">
            <div class="time">⏱ {{ getFormattedTime(test.time) }}</div>
            <h3 class="title">{{ test.title }}</h3>
            <div class="department">
              <strong>Department:</strong> {{ test.departmentName || 'N/A' }}
            </div>
          </div>

          <div class="desc">{{ test.description }}</div>

          <div class="btn-group">
            <button nz-button class="btn-outline" [routerLink]="'/admin/add-question/' + test.id">
              ➕ Add Question
            </button>
            <button nz-button class="btn-outline" [routerLink]="'/admin/view-test/' + test.id">
              👁 View Test
            </button>
          </div>
        </div>
      </nz-card>
    </div>
  </div>
</div>
