<div class="table-container">
  <nz-table #basicTable [nzData]="resultsData" [nzBordered]="false">
    <thead>
      <tr>
        <th>Test Name</th>
        <th>User Name</th>
        <th>Total Questions</th>
        <th>Correct Answers</th>
        <th>Percentage</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of basicTable.data">
        <td>{{data.testName}}</td>
        <td>{{data.userName}}</td>
        <td>{{data.totalQuestions}}</td>
        <td>{{data.correctAnswers}}</td>
        <td>{{data.percentage | number:'1.0-2'}}%</td>
      </tr>
    </tbody>
  </nz-table>
</div>
