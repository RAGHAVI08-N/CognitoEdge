<div class="main">
  <div class="scroll-wrapper">
    <div class="test-card" *ngFor="let test of tests">
      <div class="title">{{ test.title }}</div>
      <div class="time"><strong>Time:</strong> {{ getFormattedTime(test.time) }}</div>
      <div class="desc"><strong>Description:</strong> {{ test.description }}</div>
      <button nz-button nzType="primary" [routerLink]="'/user/take-test/' + test.id">
        Start Test
      </button>
    </div>
  </div>
</div>
